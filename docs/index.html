<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title id="pageTitle">BLUnion – Spell-Status Companion</title>
<style>
  :root {
    --bg: #0f1115;
    --bg-panel: #1a1d24;
    --border: #2a2e38;
    --text: #e8e9ec;
    --text-dim: #9198a3;
    --accent: #5b8dee;
    --accent-hover: #4a7cdc;
    --star: #e8c547;
    --ok: #4caf7d;
    --error: #e05d5d;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: var(--bg);
    color: var(--text);
    padding: 24px 16px 64px;
  }
  .wrap { max-width: 780px; margin: 0 auto; }
  .top-row { display: flex; justify-content: space-between; align-items: flex-start; gap: 16px; }
  h1 { font-size: 1.5rem; margin-bottom: 4px; }
  .subtitle { color: var(--text-dim); font-size: 0.9rem; margin-bottom: 24px; }
  select#langSwitch {
    background: var(--bg-panel);
    border: 1px solid var(--border);
    color: var(--text);
    border-radius: 6px;
    padding: 6px 10px;
    font-size: 0.85rem;
  }
  .panel {
    background: var(--bg-panel);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 18px;
    margin-bottom: 20px;
  }
  .panel h2 { font-size: 1.05rem; margin: 0 0 12px; }
  label { display: block; font-size: 0.85rem; color: var(--text-dim); margin-bottom: 4px; }
  input[type=text], textarea {
    width: 100%;
    background: #10131a;
    border: 1px solid var(--border);
    color: var(--text);
    border-radius: 6px;
    padding: 8px 10px;
    font-size: 0.9rem;
    font-family: inherit;
  }
  textarea { resize: vertical; min-height: 70px; font-family: monospace; font-size: 0.78rem; }
  button {
    background: var(--accent);
    color: white;
    border: none;
    border-radius: 6px;
    padding: 9px 16px;
    font-size: 0.9rem;
    cursor: pointer;
    font-weight: 600;
  }
  button:hover { background: var(--accent-hover); }
  button.secondary {
    background: transparent;
    border: 1px solid var(--border);
    color: var(--text);
  }
  button.secondary:hover { background: #22262f; }
  .row { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; margin-top: 10px; }
  .status-msg { font-size: 0.85rem; margin-top: 8px; min-height: 1.2em; }
  .status-msg.ok { color: var(--ok); }
  .status-msg.error { color: var(--error); }
  .toolbar { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 12px; align-items: center; }
  .toolbar input[type=text] { flex: 1; min-width: 160px; }
  .count-badge { font-size: 0.8rem; color: var(--text-dim); white-space: nowrap; }
  .spell-list {
    max-height: 420px;
    overflow-y: auto;
    border: 1px solid var(--border);
    border-radius: 8px;
  }
  .spell-row {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 7px 12px;
    border-bottom: 1px solid var(--border);
    font-size: 0.88rem;
  }
  .spell-row:last-child { border-bottom: none; }
  .spell-row:hover { background: #20242d; }
  .spell-row input[type=checkbox] { width: 16px; height: 16px; accent-color: var(--accent); flex-shrink: 0; }
  .spell-order { color: var(--text-dim); font-size: 0.75rem; width: 34px; flex-shrink: 0; font-variant-numeric: tabular-nums; }
  .spell-icon { width: 24px; height: 24px; border-radius: 4px; flex-shrink: 0; background: #10131a; }
  .spell-name { flex: 1; }
  .stars { color: var(--star); font-size: 0.8rem; white-space: nowrap; }
  .spell-id { color: var(--text-dim); font-size: 0.72rem; width: 46px; text-align: right; }
  code.inline { background: #10131a; padding: 1px 5px; border-radius: 4px; font-size: 0.85em; }
  .hint { color: var(--text-dim); font-size: 0.82rem; margin-top: 6px; line-height: 1.4; }
</style>
</head>
<body>
<div class="wrap">
  <div class="top-row">
    <div>
      <h1 id="txt_h1">BLUnion – Spell-Status Companion</h1>
      <div class="subtitle" id="txt_subtitle"></div>
    </div>
    <select id="langSwitch">
      <option value="de">Deutsch</option>
      <option value="en">English</option>
      <option value="fr">Français</option>
      <option value="ja">日本語</option>
    </select>
  </div>

  <div class="panel">
    <h2 id="txt_h2_export">1. Eigenen Status exportieren</h2>
    <label id="txt_label_charname" for="charName">Charaktername</label>
    <input type="text" id="charName">

    <div class="toolbar" style="margin-top:14px;">
      <input type="text" id="filterExport">
      <span class="count-badge" id="exportCount"></span>
    </div>
    <div class="spell-list" id="exportList"></div>

    <div class="row">
      <button id="btn_generate" onclick="generateCode()"></button>
      <button class="secondary" id="btn_checkall" onclick="checkAll(true)"></button>
      <button class="secondary" id="btn_uncheckall" onclick="checkAll(false)"></button>
    </div>
    <textarea id="exportOutput" readonly style="margin-top:10px;"></textarea>
    <div class="row">
      <button class="secondary" id="btn_copy" onclick="copyOutput()"></button>
      <span class="status-msg" id="exportStatus"></span>
    </div>
  </div>

  <div class="panel">
    <h2 id="txt_h2_import">2. Code eines Mitspielers importieren</h2>
    <label id="txt_label_code" for="importInput">Code (beginnt mit BLU1:)</label>
    <textarea id="importInput" placeholder="BLU1:..."></textarea>
    <div class="row">
      <button id="btn_import" onclick="importCode()"></button>
    </div>
    <div class="status-msg" id="importStatus"></div>
    <div id="importResult" style="margin-top:10px;"></div>
  </div>

  <div class="hint" id="txt_hint"></div>
</div>

const NAME_FIELD = { de: 'nameDe', en: 'nameEn', fr: 'nameFr', ja: 'nameJa' };

function detectDefaultLang() {
  const supported = Object.keys(I18N);
  const nav = (navigator.language || 'en').slice(0, 2).toLowerCase();
  return supported.includes(nav) ? nav : 'en';
}

let currentLang = detectDefaultLang();

function t() { return I18N[currentLang]; }
function spellName(s) { return s[NAME_FIELD[currentLang]]; }

function applyStaticTexts() {
  const s = t();
  document.getElementById('pageTitle').textContent = s.title;
  document.getElementById('txt_h1').textContent = s.h1;
  document.getElementById('txt_subtitle').innerHTML = s.subtitle;
  document.getElementById('txt_h2_export').textContent = s.h2Export;
  document.getElementById('txt_label_charname').textContent = s.labelCharName;
  document.getElementById('charName').placeholder = s.charNamePlaceholder;
  document.getElementById('filterExport').placeholder = s.filterPlaceholder;
  document.getElementById('btn_generate').textContent = s.btnGenerate;
  document.getElementById('btn_checkall').textContent = s.btnCheckAll;
  document.getElementById('btn_uncheckall').textContent = s.btnUncheckAll;
  document.getElementById('exportOutput').placeholder = s.exportOutputPlaceholder;
  document.getElementById('btn_copy').textContent = s.btnCopy;
  document.getElementById('txt_h2_import').textContent = s.h2Import;
  document.getElementById('txt_label_code').textContent = s.labelCode;
  document.getElementById('btn_import').textContent = s.btnImport;
  document.getElementById('txt_hint').innerHTML = s.hint;
  document.documentElement.lang = currentLang;
  updateExportCount();
}

function starString(n) { return '★'.repeat(n) + '☆'.repeat(5 - n); }

function iconUrl(iconId) {
  const padded = String(iconId).padStart(6, '0');
  const folder = padded.slice(0, 3) + '000';
  return `https://xivapi.com/i/${folder}/${padded}.png`;
}

function orderLabel(order) { return '#' + String(order).padStart(3, '0'); }

function buildList(containerId, filterInputId) {
  const container = document.getElementById(containerId);
  container.innerHTML = '';
  SPELLS.forEach(s => {
    const row = document.createElement('div');
    row.className = 'spell-row';
    row.dataset.id = s.id;
    row.dataset.order = String(s.order);
    row.innerHTML = `
      <input type="checkbox" id="${containerId}_${s.id}" data-id="${s.id}">
      <span class="spell-order">${orderLabel(s.order)}</span>
      <img class="spell-icon" src="${iconUrl(s.iconId)}" alt="" loading="lazy" onerror="this.style.visibility='hidden'">
      <span class="spell-name" data-role="name"></span>
      <span class="stars">${starString(s.stars)}</span>
      <span class="spell-id">#${s.id}</span>
    `;
    container.appendChild(row);
  });
  refreshSpellNames(containerId);
  document.getElementById(filterInputId).addEventListener('input', (e) => applyFilter(container, e.target.value));
  container.addEventListener('change', updateExportCount);
}

function refreshSpellNames(containerId) {
  const container = document.getElementById(containerId);
  const byId = Object.fromEntries(SPELLS.map(s => [String(s.id), s]));
  container.querySelectorAll('.spell-row').forEach(row => {
    const s = byId[row.dataset.id];
    const nameEl = row.querySelector('[data-role=name]');
    if (s && nameEl) nameEl.textContent = spellName(s);
    row.dataset.name = (s ? spellName(s) : '').toLowerCase();
  });
}

function applyFilter(container, raw) {
  raw = raw.trim();
  const numMatch = raw.match(/^#?(\d+)$/);
  container.querySelectorAll('.spell-row').forEach(r => {
    let visible;
    if (raw === '') {
      visible = true;
    } else if (numMatch) {
      visible = parseInt(r.dataset.order, 10) === parseInt(numMatch[1], 10);
    } else {
      visible = r.dataset.name.includes(raw.toLowerCase());
    }
    r.style.display = visible ? '' : 'none';
  });
}

function updateExportCount() {
  const checked = document.querySelectorAll('#exportList input[type=checkbox]:checked').length;
  document.getElementById('exportCount').textContent = t().count(checked, SPELLS.length);
}

function checkAll(value) {
  document.querySelectorAll('#exportList input[type=checkbox]').forEach(cb => cb.checked = value);
  updateExportCount();
}

async function gzipCompress(str) {
  if (!('CompressionStream' in window)) throw new Error('CompressionStream not supported by this browser.');
  const stream = new Blob([str]).stream().pipeThrough(new CompressionStream('gzip'));
  const buf = await new Response(stream).arrayBuffer();
  return new Uint8Array(buf);
}

async function gzipDecompress(bytes) {
  if (!('DecompressionStream' in window)) throw new Error('DecompressionStream not supported by this browser.');
  const stream = new Blob([bytes]).stream().pipeThrough(new DecompressionStream('gzip'));
  const buf = await new Response(stream).arrayBuffer();
  return new TextDecoder().decode(buf);
}

function bytesToBase64(bytes) {
  let binary = '';
  bytes.forEach(b => binary += String.fromCharCode(b));
  return btoa(binary);
}

function base64ToBytes(b64) {
  const binary = atob(b64);
  const bytes = new Uint8Array(binary.length);
  for (let i = 0; i < binary.length; i++) bytes[i] = binary.charCodeAt(i);
  return bytes;
}

async function generateCode() {
  const statusEl = document.getElementById('exportStatus');
  statusEl.className = 'status-msg';
  statusEl.textContent = '';
  const name = document.getElementById('charName').value.trim();
  if (!name) {
    statusEl.className = 'status-msg error';
    statusEl.textContent = t().errNoName;
    return;
  }
  const ids = Array.from(document.querySelectorAll('#exportList input[type=checkbox]:checked'))
    .map(cb => parseInt(cb.dataset.id, 10));

  // Feldnamen exakt wie Models/PlayerSpellStatus.cs in C# (PascalCase).
  const payload = {
    CharacterName: name,
    LearnedSpellIds: ids,
    Timestamp: new Date().toISOString(),
    IsLocalPlayer: false
  };

  try {
    const compressed = await gzipCompress(JSON.stringify(payload));
    const code = 'BLU1:' + bytesToBase64(compressed);
    document.getElementById('exportOutput').value = code;
    statusEl.className = 'status-msg ok';
    statusEl.textContent = t().okGenerated(ids.length);
  } catch (err) {
    statusEl.className = 'status-msg error';
    statusEl.textContent = t().errGeneric(err.message);
  }
}

function copyOutput() {
  const out = document.getElementById('exportOutput');
  if (!out.value) return;
  out.select();
  navigator.clipboard.writeText(out.value).then(() => {
    const statusEl = document.getElementById('exportStatus');
    statusEl.className = 'status-msg ok';
    statusEl.textContent = t().okCopied;
  });
}

async function importCode() {
  const statusEl = document.getElementById('importStatus');
  const resultEl = document.getElementById('importResult');
  statusEl.className = 'status-msg';
  statusEl.textContent = '';
  resultEl.innerHTML = '';

  const raw = document.getElementById('importInput').value.trim();
  const prefix = 'BLU1:';
  if (!raw.startsWith(prefix)) {
    statusEl.className = 'status-msg error';
    statusEl.textContent = t().errPrefix;
    return;
  }

  try {
    const bytes = base64ToBytes(raw.slice(prefix.length));
    const json = await gzipDecompress(bytes);
    const status = JSON.parse(json);
    const learned = new Set((status.LearnedSpellIds || status.learnedSpellIds || []).map(Number));

    const charName = status.CharacterName || status.characterName || t().unnamed;
    statusEl.className = 'status-msg ok';
    statusEl.textContent = t().okImported(charName, learned.size, SPELLS.length);

    const missing = SPELLS.filter(sp => !learned.has(sp.id));
    const list = document.createElement('div');
    list.className = 'spell-list';
    list.style.maxHeight = '320px';
    missing.forEach(sp => {
      const row = document.createElement('div');
      row.className = 'spell-row';
      row.innerHTML = `
        <span class="spell-order">${orderLabel(sp.order)}</span>
        <img class="spell-icon" src="${iconUrl(sp.iconId)}" alt="" loading="lazy" onerror="this.style.visibility='hidden'">
        <span class="spell-name">${spellName(sp)}</span>
        <span class="stars">${starString(sp.stars)}</span>
        <span class="spell-id">#${sp.id}</span>
      `;
      list.appendChild(row);
    });
    const label = document.createElement('label');
    label.style.marginTop = '4px';
    label.textContent = t().labelMissing(missing.length);
    resultEl.appendChild(label);
    resultEl.appendChild(list);
  } catch (err) {
    statusEl.className = 'status-msg error';
    statusEl.textContent = t().errImportFailed(err.message);
  }
}

document.getElementById('langSwitch').addEventListener('change', (e) => {
  currentLang = e.target.value;
  applyStaticTexts();
  refreshSpellNames('exportList');
});

document.getElementById('langSwitch').value = currentLang;
buildList('exportList', 'filterExport');
applyStaticTexts();
</script>
</body>
</html>
