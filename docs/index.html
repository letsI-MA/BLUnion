<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title id="pageTitle">BLUnion – Spell-Status Companion</title>
<style>
  :root {
    --bg: #0f1115;
    --bg-panel: #1a1d24;
    --border: #2a2e38;
    --text: #e8e9ec;
    --text-dim: #9198a3;
    --accent: #5b8dee;
    --accent-hover: #4a7cdc;
    --star: #e8c547;
    --ok: #4caf7d;
    --error: #e05d5d;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: var(--bg);
    color: var(--text);
    padding: 24px 16px 64px;
  }
  .wrap { max-width: 780px; margin: 0 auto; }
  .top-row { display: flex; justify-content: space-between; align-items: flex-start; gap: 16px; }
  h1 { font-size: 1.5rem; margin-bottom: 4px; }
  .subtitle { color: var(--text-dim); font-size: 0.9rem; margin-bottom: 24px; }
  select#langSwitch {
    background: var(--bg-panel);
    border: 1px solid var(--border);
    color: var(--text);
    border-radius: 6px;
    padding: 6px 10px;
    font-size: 0.85rem;
  }
  .panel {
    background: var(--bg-panel);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 18px;
    margin-bottom: 20px;
  }
  .panel h2 { font-size: 1.05rem; margin: 0 0 12px; }
  label { display: block; font-size: 0.85rem; color: var(--text-dim); margin-bottom: 4px; }
  input[type=text], input[type=number], textarea {
    width: 100%;
    background: #10131a;
    border: 1px solid var(--border);
    color: var(--text);
    border-radius: 6px;
    padding: 8px 10px;
    font-size: 0.9rem;
    font-family: inherit;
  }
  textarea { resize: vertical; min-height: 70px; font-family: monospace; font-size: 0.78rem; }
  button {
    background: var(--accent);
    color: white;
    border: none;
    border-radius: 6px;
    padding: 9px 16px;
    font-size: 0.9rem;
    cursor: pointer;
    font-weight: 600;
  }
  button:hover { background: var(--accent-hover); }
  button.secondary {
    background: transparent;
    border: 1px solid var(--border);
    color: var(--text);
  }
  button.secondary:hover { background: #22262f; }
  .row { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; margin-top: 10px; }
  .status-msg { font-size: 0.85rem; margin-top: 8px; min-height: 1.2em; }
  .status-msg.ok { color: var(--ok); }
  .status-msg.error { color: var(--error); }
  .toolbar { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 12px; align-items: center; }
  .toolbar input[type=text] { flex: 1; min-width: 160px; }
  .count-badge { font-size: 0.8rem; color: var(--text-dim); white-space: nowrap; }
  .spell-list {
    max-height: 420px;
    overflow-y: auto;
    border: 1px solid var(--border);
    border-radius: 8px;
  }
  .spell-row {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 7px 12px;
    border-bottom: 1px solid var(--border);
    font-size: 0.88rem;
  }
  .spell-row:last-child { border-bottom: none; }
  .spell-row:hover { background: #20242d; }
  .spell-row input[type=checkbox] { width: 16px; height: 16px; accent-color: var(--accent); flex-shrink: 0; }
  .spell-order { color: var(--text-dim); font-size: 0.75rem; width: 34px; flex-shrink: 0; font-variant-numeric: tabular-nums; }
  .spell-icon { width: 24px; height: 24px; border-radius: 4px; flex-shrink: 0; background: #10131a; }
  .spell-name { flex: 1; }
  .stars { color: var(--star); font-size: 0.8rem; white-space: nowrap; }
  .spell-id { color: var(--text-dim); font-size: 0.72rem; width: 46px; text-align: right; }
  code.inline { background: #10131a; padding: 1px 5px; border-radius: 4px; font-size: 0.85em; }
  .hint { color: var(--text-dim); font-size: 0.82rem; margin-top: 6px; line-height: 1.4; }
  h3.gf-subheader { font-size: 0.95rem; margin: 18px 0 8px; color: var(--text); }
  .gf-tag-row { display: flex; gap: 14px; flex-wrap: wrap; margin-top: 10px; }
  .gf-tag-row label, .gf-checkbox-row label {
    display: flex; align-items: center; gap: 6px; font-size: 0.85rem; color: var(--text); margin-bottom: 0;
  }
  .gf-tag-row input[type=checkbox], .gf-checkbox-row input[type=checkbox] {
    width: 16px; height: 16px; accent-color: var(--accent);
  }
  .gf-entry { padding: 10px 12px; border-bottom: 1px solid var(--border); font-size: 0.88rem; }
  .gf-entry:last-child { border-bottom: none; }
  .gf-entry:hover { background: #20242d; }
  .gf-entry-head { display: flex; justify-content: space-between; align-items: baseline; gap: 10px; flex-wrap: wrap; }
  .gf-entry-name { font-weight: 600; }
  .gf-entry-meta { color: var(--text-dim); font-size: 0.8rem; margin-top: 3px; line-height: 1.4; }
  .gf-entry .row { margin-top: 8px; }
  .group-member {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    background: #10131a;
    border: 1px solid var(--border);
    border-radius: 20px;
    padding: 5px 8px 5px 14px;
    margin: 0 8px 8px 0;
    font-size: 0.85rem;
  }
  .group-member button {
    background: transparent;
    color: var(--text-dim);
    border: none;
    padding: 2px 6px;
    font-size: 0.85rem;
    line-height: 1;
    cursor: pointer;
  }
  .group-member button:hover { color: var(--error); }
  .group-row {
    padding: 8px 12px;
    border-bottom: 1px solid var(--border);
    font-size: 0.85rem;
  }
  .group-row:last-child { border-bottom: none; }
  .group-row .group-row-header { display: flex; align-items: center; gap: 10px; margin-bottom: 4px; }
  .group-row .group-detail { font-size: 0.78rem; color: var(--text-dim); margin-left: 44px; }
  .group-detail .missing { color: var(--error); }
  .group-detail .known { color: var(--ok); }
</style>

function starString(n) { return '★'.repeat(n) + '☆'.repeat(5 - n); }

function iconUrl(iconId) {
  const padded = String(iconId).padStart(6, '0');
  const folder = padded.slice(0, 3) + '000';
  return `https://xivapi.com/i/${folder}/${padded}.png`;
}

function orderLabel(order) { return '#' + String(order).padStart(3, '0'); }

function buildList(containerId, filterInputId) {
  const container = document.getElementById(containerId);
  container.innerHTML = '';
  SPELLS.forEach(s => {
    const row = document.createElement('div');
    row.className = 'spell-row';
    row.dataset.id = s.id;
    row.dataset.order = String(s.order);
    row.innerHTML = `
      <input type="checkbox" id="${containerId}_${s.id}" data-id="${s.id}">
      <span class="spell-order">${orderLabel(s.order)}</span>
      <img class="spell-icon" src="${iconUrl(s.iconId)}" alt="" loading="lazy" onerror="this.style.visibility='hidden'">
      <span class="spell-name" data-role="name"></span>
      <span class="stars">${starString(s.stars)}</span>
      <span class="spell-id">#${s.id}</span>
    `;
    container.appendChild(row);
  });
  refreshSpellNames(containerId);
  document.getElementById(filterInputId).addEventListener('input', (e) => applyFilter(container, e.target.value));
  container.addEventListener('change', updateExportCount);
}

function refreshSpellNames(containerId) {
  const container = document.getElementById(containerId);
  const byId = Object.fromEntries(SPELLS.map(s => [String(s.id), s]));
  container.querySelectorAll('.spell-row').forEach(row => {
    const s = byId[row.dataset.id];
    const nameEl = row.querySelector('[data-role=name]');
    if (s && nameEl) nameEl.textContent = spellName(s);
    row.dataset.name = (s ? spellName(s) : '').toLowerCase();
  });
}

function applyFilter(container, raw) {
  raw = raw.trim();
  const numMatch = raw.match(/^#?(\d+)$/);
  container.querySelectorAll('.spell-row').forEach(r => {
    let visible;
    if (raw === '') {
      visible = true;
    } else if (numMatch) {
      visible = parseInt(r.dataset.order, 10) === parseInt(numMatch[1], 10);
    } else {
      visible = r.dataset.name.includes(raw.toLowerCase());
    }
    r.style.display = visible ? '' : 'none';
  });
}

function updateExportCount() {
  const checked = document.querySelectorAll('#exportList input[type=checkbox]:checked').length;
  document.getElementById('exportCount').textContent = t().count(checked, SPELLS.length);
}

function checkAll(value) {
  document.querySelectorAll('#exportList input[type=checkbox]').forEach(cb => cb.checked = value);
  updateExportCount();
}

// --- Gruppenvergleich ---
// group: Array von { name, learned: Set<number> }. Wird sowohl durch
// manuelles Hinzufügen der eigenen Auswahl als auch automatisch beim
// Importieren eines Codes befüllt.
let group = [];

// Zwischengespeichertes Rohergebnis des letzten GET /profiles/browse-Aufrufs (siehe gfBrowse) -
// erlaubt applyGroupFinderTexts(), die Liste bei einem Sprachwechsel mit übersetzten Tags neu zu
// rendern, ohne den Worker ein zweites Mal abzufragen.
let lastGfBrowseEntries = null;

function addOrUpdateGroupMember(name, learnedSet) {
  const idx = group.findIndex(m => m.name === name);
  const member = { name, learned: learnedSet };
  if (idx >= 0) {
    group[idx] = member;
  } else {
    group.push(member);
  }
}

function addOwnSelectionToGroup() {
  const name = document.getElementById('charName').value.trim();
  const statusEl = document.getElementById('exportStatus');
  if (!name) {
    statusEl.className = 'status-msg error';
    statusEl.textContent = t().errNoName;
    return;
  }
  const ids = Array.from(document.querySelectorAll('#exportList input[type=checkbox]:checked'))
    .map(cb => parseInt(cb.dataset.id, 10));
  addOrUpdateGroupMember(name, new Set(ids));
  statusEl.className = 'status-msg ok';
  statusEl.textContent = t().addedToGroup(name);
  renderGroup();
}

function removeGroupMember(name) {
  group = group.filter(m => m.name !== name);
  renderGroup();
}

function clearGroup() {
  group = [];
  renderGroup();
}

function renderGroup() {
  const emptyHint = document.getElementById('txt_group_empty_hint');
  const membersList = document.getElementById('groupMembersList');
  const toolbar = document.getElementById('groupToolbar');
  const tableEl = document.getElementById('groupTable');

  if (group.length === 0) {
    emptyHint.style.display = '';
    emptyHint.textContent = t().groupEmptyHint;
    membersList.innerHTML = '';
    toolbar.style.display = 'none';
    tableEl.style.display = 'none';
    return;
  }

  emptyHint.style.display = 'none';
  toolbar.style.display = 'flex';
  document.getElementById('groupTotemRow').style.display = 'flex';
  tableEl.style.display = '';

  // Mitgliederliste als Chips
  membersList.innerHTML = '';
  group.forEach(m => {
    const chip = document.createElement('div');
    chip.className = 'group-member';
    const safeName = m.name.replace(/'/g, "\\'");
    chip.innerHTML = `
      <span>${m.name} (${t().groupMemberCount(m.learned.size, SPELLS.length)})</span>
      <button onclick="removeGroupMember('${safeName}')" title="${t().removeMember}">✕</button>
    `;
    membersList.appendChild(chip);
  });

  renderGroupTable(document.getElementById('filterGroup').value);
}

function renderGroupTable(filterRaw) {
  const tableEl = document.getElementById('groupTable');
  tableEl.innerHTML = '';

  const raw = (filterRaw || '').trim();
  const numMatch = raw.match(/^#?(\d+)$/);
  const hideTotems = document.getElementById('hideTotemsToggle').checked;
  const sortMode = document.getElementById('groupSortMode').value;

  let visibleSpells = SPELLS.filter(sp => {
    if (hideTotems && sp.isTotem) return false;
    if (raw === '') return true;
    if (numMatch) return sp.order === parseInt(numMatch[1], 10);
    return spellName(sp).toLowerCase().includes(raw.toLowerCase());
  });

  // Dringlichkeit: Anzahl Gruppenmitglieder, denen der Spell fehlt (absteigend).
  const missingCount = (sp) => group.filter(m => !m.learned.has(sp.id)).length;

  visibleSpells = visibleSpells.slice().sort((a, b) => {
    switch (sortMode) {
      case 'order':
        return a.order - b.order;
      case 'name':
        return spellName(a).localeCompare(spellName(b));
      case 'stars':
        return b.stars - a.stars || a.order - b.order;
      case 'urgency':
      default:
        return missingCount(b) - missingCount(a) || a.order - b.order;
    }
  });

  visibleSpells.forEach(sp => {
    const missing = group.filter(m => !m.learned.has(sp.id)).map(m => m.name);
    const known = group.filter(m => m.learned.has(sp.id)).map(m => m.name);

    const row = document.createElement('div');
    row.className = 'group-row';
    row.innerHTML = `
      <div class="group-row-header">
        <span class="spell-order">${orderLabel(sp.order)}</span>
        <img class="spell-icon" src="${iconUrl(sp.iconId)}" alt="" loading="lazy" onerror="this.style.visibility='hidden'">
        <span class="spell-name">${spellName(sp)}</span>
        <span class="stars">${starString(sp.stars)}</span>
      </div>
      <div class="group-detail">
        <span class="missing">${t().groupMissingLabel(missing.length)} ${missing.join(', ') || '-'}</span><br>
        <span class="known">${t().groupKnownLabel(known.length)} ${known.join(', ') || '-'}</span>
      </div>
    `;
    tableEl.appendChild(row);
  });
}

document.getElementById('filterGroup').addEventListener('input', (e) => renderGroupTable(e.target.value));
document.getElementById('hideTotemsToggle').addEventListener('change', () => renderGroupTable(document.getElementById('filterGroup').value));
document.getElementById('groupSortMode').addEventListener('change', () => renderGroupTable(document.getElementById('filterGroup').value));

async function gzipCompress(str) {
  if (!('CompressionStream' in window)) throw new Error('CompressionStream not supported by this browser.');
  const stream = new Blob([str]).stream().pipeThrough(new CompressionStream('gzip'));
  const buf = await new Response(stream).arrayBuffer();
  return new Uint8Array(buf);
}

async function gzipDecompress(bytes) {
  if (!('DecompressionStream' in window)) throw new Error('DecompressionStream not supported by this browser.');
  const stream = new Blob([bytes]).stream().pipeThrough(new DecompressionStream('gzip'));
  const buf = await new Response(stream).arrayBuffer();
  return new TextDecoder().decode(buf);
}

function bytesToBase64(bytes) {
  let binary = '';
  bytes.forEach(b => binary += String.fromCharCode(b));
  return btoa(binary);
}

function base64ToBytes(b64) {
  const binary = atob(b64);
  const bytes = new Uint8Array(binary.length);
  for (let i = 0; i < binary.length; i++) bytes[i] = binary.charCodeAt(i);
  return bytes;
}

// URL-sicheres Base64 ohne Padding, für das kompakte "BLU:"-Format.
function bytesToBase64Url(bytes) {
  return bytesToBase64(bytes).replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, '');
}

function base64UrlToBytes(str) {
  let b64 = str.replace(/-/g, '+').replace(/_/g, '/');
  while (b64.length % 4) b64 += '=';
  return base64ToBytes(b64);
}

// Feste, stabile Bit-Reihenfolge: alle 124 Spell-Ids aufsteigend sortiert.
const SORTED_IDS = SPELLS.map(s => s.id).slice().sort((a, b) => a - b);

// Reines Bit-Mapping OHNE das Namens-Präfixbyte des "BLU:"-Formats (siehe encodeCompact/
// decodeCompact) - das ist exakt das Format, das der Live-Sync-Worker in "spellBitmaskBase64"
// erwartet/liefert (siehe worker/src/index.ts, Feld-Doc bei BITMASK_BYTES). Aus encodeCompact/
// decodeCompact herausgezogen und vom Gruppenfinder-Code weiter unten (gfPublishMyEntry/
// gfRenderBrowseResults) wiederverwendet, statt eine zweite Bitmask-Implementierung zu bauen -
// beide Varianten (mit/ohne Namenspräfix) teilen sich dieselbe SORTED_IDS-Bit-Zuordnung.
function buildBitmask(learnedIds) {
  const bitmask = new Uint8Array(16); // 128 Bits, 124 genutzt
  SORTED_IDS.forEach((id, idx) => {
    if (learnedIds.has(id)) bitmask[idx >> 3] |= (1 << (idx % 8));
  });
  return bitmask;
}

function decodeBitmask(bitmask) {
  const learned = new Set();
  SORTED_IDS.forEach((id, idx) => {
    if (bitmask[idx >> 3] & (1 << (idx % 8))) learned.add(id);
  });
  return learned;
}

function encodeCompact(name, learnedIds) {
  const nameBytes = new TextEncoder().encode(name);
  if (nameBytes.length > 255) throw new Error('Name too long.');

  const bitmask = buildBitmask(learnedIds);

  const payload = new Uint8Array(1 + nameBytes.length + 16);
  payload[0] = nameBytes.length;
  payload.set(nameBytes, 1);
  payload.set(bitmask, 1 + nameBytes.length);

  return 'BLU:' + bytesToBase64Url(payload);
}

function decodeCompact(payload) {
  const nameLen = payload[0];
  const name = new TextDecoder().decode(payload.slice(1, 1 + nameLen));
  const bitmask = payload.slice(1 + nameLen, 1 + nameLen + 16);

  return { name, learned: decodeBitmask(bitmask) };
}

async function generateCode() {
  const statusEl = document.getElementById('exportStatus');
  statusEl.className = 'status-msg';
  statusEl.textContent = '';
  const name = document.getElementById('charName').value.trim();
  if (!name) {
    statusEl.className = 'status-msg error';
    statusEl.textContent = t().errNoName;
    return;
  }
  const ids = Array.from(document.querySelectorAll('#exportList input[type=checkbox]:checked'))
    .map(cb => parseInt(cb.dataset.id, 10));

  try {
    const code = encodeCompact(name, new Set(ids));
    document.getElementById('exportOutput').value = code;
    statusEl.className = 'status-msg ok';
    statusEl.textContent = t().okGenerated(ids.length);
  } catch (err) {
    statusEl.className = 'status-msg error';
    statusEl.textContent = t().errGeneric(err.message);
  }
}

function copyOutput() {
  const out = document.getElementById('exportOutput');
  if (!out.value) return;
  out.select();
  navigator.clipboard.writeText(out.value).then(() => {
    const statusEl = document.getElementById('exportStatus');
    statusEl.className = 'status-msg ok';
    statusEl.textContent = t().okCopied;
  });
}

async function importCode() {
  const statusEl = document.getElementById('importStatus');
  const resultEl = document.getElementById('importResult');
  statusEl.className = 'status-msg';
  statusEl.textContent = '';
  resultEl.innerHTML = '';

  const raw = document.getElementById('importInput').value.trim();

  try {
    let charName, learned;

    if (raw.startsWith('BLU:')) {
      const payload = base64UrlToBytes(raw.slice('BLU:'.length));
      const decoded = decodeCompact(payload);
      charName = decoded.name || t().unnamed;
      learned = decoded.learned;
    } else if (raw.startsWith('BLU1:')) {
      // Altes Format (gzip+JSON), weiterhin lesbar für Übergangszeit.
      const bytes = base64ToBytes(raw.slice('BLU1:'.length));
      const json = await gzipDecompress(bytes);
      const status = JSON.parse(json);
      charName = status.CharacterName || status.characterName || t().unnamed;
      learned = new Set((status.LearnedSpellIds || status.learnedSpellIds || []).map(Number));
    } else {
      statusEl.className = 'status-msg error';
      statusEl.textContent = t().errPrefix;
      return;
    }

    statusEl.className = 'status-msg ok';
    statusEl.textContent = t().okImported(charName, learned.size, SPELLS.length);

    // Auswahl oben (Export-Panel) auf den importierten Status übernehmen,
    // damit direkt sichtbar ist, was der importierte Spieler schon kann.
    document.getElementById('charName').value = charName;
    document.querySelectorAll('#exportList input[type=checkbox]').forEach(cb => {
      cb.checked = learned.has(parseInt(cb.dataset.id, 10));
    });
    updateExportCount();

    // Automatisch auch zur Gruppe hinzufügen/aktualisieren.
    addOrUpdateGroupMember(charName, learned);
    renderGroup();

    const missing = SPELLS.filter(sp => !learned.has(sp.id));
    const list = document.createElement('div');
    list.className = 'spell-list';
    list.style.maxHeight = '320px';
    missing.forEach(sp => {
      const row = document.createElement('div');
      row.className = 'spell-row';
      row.innerHTML = `
        <span class="spell-order">${orderLabel(sp.order)}</span>
        <img class="spell-icon" src="${iconUrl(sp.iconId)}" alt="" loading="lazy" onerror="this.style.visibility='hidden'">
        <span class="spell-name">${spellName(sp)}</span>
        <span class="stars">${starString(sp.stars)}</span>
        <span class="spell-id">#${sp.id}</span>
      `;
      list.appendChild(row);
    });
    const label = document.createElement('label');
    label.style.marginTop = '4px';
    label.textContent = t().labelMissing(missing.length);
    resultEl.appendChild(label);
    resultEl.appendChild(list);
  } catch (err) {
    statusEl.className = 'status-msg error';
    statusEl.textContent = t().errImportFailed(err.message);
  }
}

// --- Gruppenfinder (Phase 2 von Live-Sync) ---
// Spricht denselben Cloudflare-Worker/dieselben Endpoints an wie das Dalamud-Plugin
// (siehe worker/src/index.ts) - KEIN eigenes Backend, keine Parallelstruktur. Genau wie beim
// Plugin gibt es kein separates Gruppenfinder-Profil/-Login: Sichtbarkeit setzt einen gültigen
// BLU:-Code voraus (denselben wie oben unter "2."), aus dem Name + Spellstatus decodiert werden.
const WORKER_BASE_URL = 'https://blunion-livesync.skysurfer101.workers.dev';

// Dieselben internen (englischen) Wire-Values wie Plugin/Worker (siehe worker/src/index.ts
// ALLOWED_AVAILABILITY_TAGS bzw. Models/AvailabilityTag.cs im Plugin) - NICHT neu erfunden.
const AVAILABILITY_TAGS = ['morning', 'afternoon', 'evening', 'weekend', 'flexible'];

// TTL, die die Website beim Veröffentlichen IMMER mitschickt (siehe worker/src/index.ts
// resolveTtlSeconds) - kürzer als die reguläre 90-Tage-Plugin-Lebensdauer, damit von hier aus
// veröffentlichte Profile nicht wochenlang herumliegen, falls sie nie wieder aktualisiert werden.
const GF_TTL_HOURS = 24;

function gfTokenStorageKey(world, characterName) {
  return `blunion_livesync_token_${world.trim().toLowerCase()}_${characterName.trim().toLowerCase()}`;
}

function gfGetStoredToken(world, characterName) {
  return localStorage.getItem(gfTokenStorageKey(world, characterName));
}

function gfSetStoredToken(world, characterName, token) {
  localStorage.setItem(gfTokenStorageKey(world, characterName), token);
}

function gfRemoveStoredToken(world, characterName) {
  localStorage.removeItem(gfTokenStorageKey(world, characterName));
}

function gfProfileUrl(world, characterName) {
  return `${WORKER_BASE_URL}/profile/${encodeURIComponent(world)}/${encodeURIComponent(characterName)}`;
}

// Decodiert den aktuellen Textarea-Inhalt über DIESELBE decodeCompact-Funktion wie der normale
// Import unter "2." (siehe Aufgabenstellung: keine neue Parsing-Logik) - liefert null bei leerem/
// ungültigem Code statt zu werfen, damit Aufrufer (Preview/Publish/Delete) das defensiv behandeln
// können, ohne selbst try/catch zu brauchen.
function gfTryDecodeMyCode() {
  const raw = document.getElementById('gfImportInput').value.trim();
  if (!raw.startsWith('BLU:')) return null;
  try {
    const decoded = decodeCompact(base64UrlToBytes(raw.slice('BLU:'.length)));
    return decoded.name ? decoded : null;
  } catch {
    return null;
  }
}

// Rein lesend/lokal - aktualisiert Vorschau-Text + Publish/Update-Button-Beschriftung + Löschen-
// Button-Aktivierung, OHNE irgendetwas an den Worker zu senden. Läuft bei jeder Änderung von
// Code/World, nach einem erfolgreichen Publish/Delete und bei Sprachwechsel (siehe
// applyGroupFinderTexts) - "Aktualisieren" statt "Veröffentlichen", sobald für die decodierte
// Name+World-Kombination bereits ein Token in localStorage gefunden wird (siehe Aufgabenstellung).
function gfUpdateMyEntryPreview() {
  const decoded = gfTryDecodeMyCode();
  const world = document.getElementById('gfWorld').value.trim();
  const previewEl = document.getElementById('gfDecodedPreview');
  const publishBtn = document.getElementById('btn_gfPublish');
  const deleteBtn = document.getElementById('btn_gfDelete');

  if (decoded && world) {
    previewEl.textContent = t().gfDecodedAs(decoded.name);
    const existingToken = gfGetStoredToken(world, decoded.name);
    publishBtn.textContent = existingToken ? t().btnGfUpdate : t().btnGfPublish;
    deleteBtn.disabled = !existingToken;
  } else {
    previewEl.textContent = '';
    publishBtn.textContent = t().btnGfPublish;
    deleteBtn.disabled = true;
  }
}

async function gfPublishMyEntry() {
  const statusEl = document.getElementById('gfMyEntryStatus');
  statusEl.className = 'status-msg';
  statusEl.textContent = '';

  const decoded = gfTryDecodeMyCode();
  if (!decoded) {
    statusEl.className = 'status-msg error';
    statusEl.textContent = t().gfErrNoCode;
    return;
  }

  const world = document.getElementById('gfWorld').value.trim();
  if (!world) {
    statusEl.className = 'status-msg error';
    statusEl.textContent = t().gfErrNoWorld;
    return;
  }

  const characterName = decoded.name;
  const existingToken = gfGetStoredToken(world, characterName);

  const tags = AVAILABILITY_TAGS.filter(tag => document.getElementById(`gfTag_${tag}`).checked);
  const note = document.getElementById('gfNote').value.slice(0, 60);
  const wantedPlayerCount = parseInt(document.getElementById('gfWantedCount').value, 10) || 0;
  const visibility = document.getElementById('gfVisible').checked ? 'listed' : 'unlisted';

  // Dieselbe reine Bitmask-Kodierung (ohne Namens-Präfixbyte) wie der Worker erwartet - siehe
  // buildBitmask-Doc weiter oben, extrahiert aus encodeCompact statt neu gebaut.
  const body = {
    spellBitmaskBase64: bytesToBase64Url(buildBitmask(decoded.learned)),
    visibility,
    availabilityTags: tags,
    note,
    wantedPlayerCount,
    ttlHours: GF_TTL_HOURS,
  };
  if (existingToken) body.editToken = existingToken;

  try {
    const response = await fetch(gfProfileUrl(world, characterName), {
      method: 'PUT',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(body),
    });
    const json = await response.json().catch(() => null);

    if (!response.ok) {
      statusEl.className = 'status-msg error';
      statusEl.textContent = t().gfErrPublishFailed((json && json.error) || `HTTP ${response.status}`);
      return;
    }

    // Beim allerersten PUT für diesen Charakter vom Worker generiert und einmalig zurückgegeben
    // (siehe worker/README.md) - ab jetzt lokal gespeichert, damit ein erneuter Besuch dieser
    // Seite das Profil aktualisieren statt ein zweites anzulegen kann.
    if (json && json.editToken) gfSetStoredToken(world, characterName, json.editToken);

    statusEl.className = 'status-msg ok';
    statusEl.textContent = t().gfOkPublished(characterName);
    gfUpdateMyEntryPreview();
  } catch (err) {
    statusEl.className = 'status-msg error';
    statusEl.textContent = t().gfErrPublishFailed(err.message);
  }
}

async function gfDeleteMyEntry() {
  const statusEl = document.getElementById('gfMyEntryStatus');
  const decoded = gfTryDecodeMyCode();
  const world = document.getElementById('gfWorld').value.trim();
  if (!decoded || !world) return;

  const characterName = decoded.name;
  const token = gfGetStoredToken(world, characterName);
  if (!token) return; // Button ist in diesem Fall ohnehin disabled, siehe gfUpdateMyEntryPreview.

  statusEl.className = 'status-msg';
  statusEl.textContent = '';

  try {
    const response = await fetch(gfProfileUrl(world, characterName), {
      method: 'DELETE',
      headers: { 'X-Edit-Token': token },
    });

    if (!response.ok && response.status !== 404) {
      const json = await response.json().catch(() => null);
      statusEl.className = 'status-msg error';
      statusEl.textContent = t().gfErrDeleteFailed((json && json.error) || `HTTP ${response.status}`);
      return;
    }

    gfRemoveStoredToken(world, characterName);
    statusEl.className = 'status-msg ok';
    statusEl.textContent = t().gfOkDeleted(characterName);
    gfUpdateMyEntryPreview();
  } catch (err) {
    statusEl.className = 'status-msg error';
    statusEl.textContent = t().gfErrDeleteFailed(err.message);
  }
}

async function gfBrowse() {
  const dataCenter = document.getElementById('gfDataCenter').value;
  const statusEl = document.getElementById('gfBrowseStatus');
  const listEl = document.getElementById('gfBrowseList');
  statusEl.className = 'status-msg';
  statusEl.textContent = '';

  if (!dataCenter) {
    listEl.style.display = 'none';
    listEl.innerHTML = '';
    lastGfBrowseEntries = null;
    return;
  }

  try {
    const response = await fetch(`${WORKER_BASE_URL}/profiles/browse?dataCenter=${encodeURIComponent(dataCenter)}`);
    const json = await response.json().catch(() => null);

    if (!response.ok) {
      statusEl.className = 'status-msg error';
      statusEl.textContent = t().gfErrBrowseFailed((json && json.error) || `HTTP ${response.status}`);
      return;
    }

    lastGfBrowseEntries = Array.isArray(json) ? json : [];
    gfRenderBrowseResults(lastGfBrowseEntries);
  } catch (err) {
    statusEl.className = 'status-msg error';
    statusEl.textContent = t().gfErrBrowseFailed(err.message);
  }
}

// Rein clientseitiges Rendern der zuletzt abgerufenen Rohdaten (siehe lastGfBrowseEntries) -
// separat von gfBrowse(), damit ein Sprachwechsel (übersetzte Tags/Beschriftungen) neu rendern
// kann, ohne den Worker ein zweites Mal abzufragen (siehe applyGroupFinderTexts).
function gfRenderBrowseResults(entries) {
  const listEl = document.getElementById('gfBrowseList');
  listEl.innerHTML = '';
  listEl.style.display = '';

  if (entries.length === 0) {
    const hint = document.createElement('div');
    hint.className = 'hint';
    hint.style.padding = '10px 12px';
    hint.textContent = t().gfNoEntries;
    listEl.appendChild(hint);
    return;
  }

  entries.forEach(entry => {
    let learned;
    try {
      learned = decodeBitmask(base64UrlToBytes(entry.spellBitmaskBase64 || ''));
    } catch {
      learned = new Set();
    }

    const tagLabels = (entry.availabilityTags || []).map(tag => (t().gfTags[tag] || tag)).join(', ');
    const note = entry.note || '';
    const wantedText = entry.wantedPlayerCount ? String(entry.wantedPlayerCount) : t().gfWantedAny;

    const row = document.createElement('div');
    row.className = 'gf-entry';
    row.innerHTML = `
      <div class="gf-entry-head">
        <span class="gf-entry-name">${entry.characterName || ''} (${entry.world || ''})</span>
        <span class="count-badge">${t().count(learned.size, SPELLS.length)}</span>
      </div>
      <div class="gf-entry-meta">
        ${tagLabels ? tagLabels + '<br>' : ''}${note ? `"${note}"<br>` : ''}${t().gfWantedLabel(wantedText)}
      </div>
      <div class="row">
        <button class="secondary">${t().btnGfAddToComparison}</button>
      </div>
    `;
    listEl.appendChild(row);

    // onclick nachträglich per addEventListener statt als Inline-HTML-Attribut gesetzt, weil
    // Charakternamen Apostrophe/Sonderzeichen enthalten können (z.B. "Y'shtola Rhul") - als
    // Inline-onclick-Wert müsste der Name sonst zusätzlich escaped werden; ein Closure ist hier
    // einfacher und robuster.
    row.querySelector('button').addEventListener('click', () => {
      // Dieselbe Chip-Hinzufügen-/Dedup-Logik wie beim manuellen Code-Import (siehe importCode()
      // oben) - KEIN zweiter Vergleichspfad, siehe Aufgabenstellung.
      const name = entry.characterName || t().unnamed;
      addOrUpdateGroupMember(name, learned);
      renderGroup();
      const browseStatusEl = document.getElementById('gfBrowseStatus');
      browseStatusEl.className = 'status-msg ok';
      browseStatusEl.textContent = t().addedToGroup(name);
    });
  });
}

function applyGroupFinderTexts() {
  const s = t();
  document.getElementById('txt_h2_groupfinder').textContent = s.h2GroupFinder;
  document.getElementById('txt_gf_intro').textContent = s.gfIntro;
  document.getElementById('txt_gf_myentry_header').textContent = s.gfMyEntryHeader;
  document.getElementById('txt_gf_label_code').textContent = s.labelCode;
  document.getElementById('txt_gf_label_world').textContent = s.gfLabelWorld;
  document.getElementById('gfWorld').placeholder = s.gfWorldPlaceholder;
  document.getElementById('txt_gf_visible').textContent = s.gfVisibleLabel;
  AVAILABILITY_TAGS.forEach(tag => {
    document.getElementById(`txt_gf_tag_${tag}`).textContent = s.gfTags[tag];
  });
  document.getElementById('txt_gf_label_note').textContent = s.gfLabelNote;
  document.getElementById('txt_gf_label_wanted').textContent = s.gfLabelWantedCount;
  document.getElementById('txt_gf_others_header').textContent = s.gfOthersHeader;
  document.getElementById('txt_gf_label_dc').textContent = s.gfLabelDataCenter;
  document.getElementById('txt_gf_dc_placeholder').textContent = s.gfDataCenterPlaceholder;
  document.getElementById('btn_gfRefresh').textContent = s.btnGfRefresh;

  // Aktualisiert Publish/Update-Button-Beschriftung + Vorschau in der neuen Sprache.
  gfUpdateMyEntryPreview();
  // Re-rendert die zuletzt geladene Browse-Liste mit übersetzten Tags, falls schon welche
  // geladen wurden - ohne den Worker erneut abzufragen.
  if (lastGfBrowseEntries) gfRenderBrowseResults(lastGfBrowseEntries);
}

document.getElementById('gfImportInput').addEventListener('input', gfUpdateMyEntryPreview);
document.getElementById('gfWorld').addEventListener('input', gfUpdateMyEntryPreview);
document.getElementById('gfDataCenter').addEventListener('change', gfBrowse);

document.getElementById('langSwitch').addEventListener('change', (e) => {
  currentLang = e.target.value;
  applyStaticTexts();
  refreshSpellNames('exportList');
});

document.getElementById('langSwitch').value = currentLang;
buildList('exportList', 'filterExport');
applyStaticTexts(); // ruft am Ende u.a. applyGroupFinderTexts() -> gfUpdateMyEntryPreview() mit auf.
</script>
