# BLUnion Live-Sync Worker (Phase 1) - siehe README.md für Setup/Deploy.
#
# "name" bestimmt die generierte *.workers.dev-URL (https://<name>.<subdomain>.workers.dev) -
# nach dem ersten "wrangler deploy" muss diese URL in die Plugin-Konstante
# LiveSyncService.WorkerBaseUrl (Services/LiveSyncService.cs) eingetragen werden.
name = "blunion-livesync"
main = "src/index.ts"
compatibility_date = "2026-08-20"

# KV-Namespace für die Profil-Speicherung (siehe Datenmodell in README.md). Die "id" hier ist
# ein Platzhalter - vor dem ersten Deploy per
#   wrangler kv namespace create BLUNION_PROFILES
# einen echten Namespace anlegen und dessen "id" hier eintragen (siehe README.md).
[[kv_namespaces]]
binding = "BLUNION_PROFILES"
id = "f0830d1c36fc475ba0dca0093dc6a528"

# IP-basiertes Rate-Limiting für die schreibenden Endpunkte (PUT/DELETE auf /profile und /group,
# siehe enforceWriteRateLimit in src/index.ts) - bestätigter Fremd-Traffic auf dem öffentlichen,
# tokenlosen PUT-Endpoint macht einen Basisschutz gegen Missbrauch/Spam nötig.
#
# Bewusst das native Workers-Rate-Limiting-BINDING statt der Dashboard-"Rate Limiting Rules": die
# sind ein Zonen-/WAF-Feature und setzen eine bei Cloudflare verwaltete, eigene Zone voraus -
# dieser Worker läuft aber unter *.workers.dev (siehe "name" oben), ohne eigene Zone. Ebenso
# bewusst NICHT die im README als Alternative genannte KV-Zähler-Eigenimplementierung (siehe
# Aufgabenstellung) - das Binding leistet exakt das, ohne zusätzliche KV-Reads/Writes pro Request
# und ohne eigene TTL-/Race-Condition-Logik.
#
# "namespace_id" ist NUR ein account-weit eindeutiger Bezeichner für DIESEN Limiter (kein Bezug zu
# den KV-Namespace-IDs oben) - "1" reicht, da es aktuell der einzige Rate-Limiter dieses Workers
# ist. limit/period-Begründung siehe enforceWriteRateLimit-Doc in src/index.ts.
[[ratelimits]]
name = "WRITE_RATE_LIMITER"
namespace_id = "1"

[ratelimits.simple]
limit = 20
period = 60

# Discord-Slash-Command-Integration Phase 1 (siehe DISCORD_INTEGRATION.md und
# handleDiscordInteractions/Env.DISCORD_PUBLIC_KEY in src/index.ts) - der eigentliche Wert wird
# NIE hier eingetragen (siehe Aufgabenstellung "keine Secrets im Code"), sondern für Produktion per
#   wrangler secret put DISCORD_PUBLIC_KEY
# gesetzt - das überschreibt einen gleichnamigen [vars]-Eintrag automatisch (offizielles
# Cloudflare-Muster: Dev-Default hier/​in .dev.vars, echtes Secret in Produktion). Für lokale
# Entwicklung/Tests siehe stattdessen worker/.dev.vars (aus .dev.vars.example kopieren) - NICHT
# hier in [vars], damit auch ein lokaler Test-Schlüssel nicht versehentlich committed wird.
#
# Persistente Gruppen-Karten Phase 1.5 (siehe DISCORD_INTEGRATION.md, DATA_CENTER_TO_REGION/
# syncGroupDiscordCard in src/index.ts) - vier weitere, region-spezifische Webhook-Secrets, aus
# demselben Grund ebenfalls NIE hier im Klartext, sondern per
#   wrangler secret put DISCORD_WEBHOOK_NA   (analog für _EU/_JP/_OC)
# gesetzt bzw. lokal über worker/.dev.vars. Anders als DISCORD_PUBLIC_KEY sind sie im Env-Typ
# OPTIONAL - eine (noch) nicht konfigurierte Region lässt die Kartenfunktion für diese Region
# einfach nichts tun, siehe Env.DISCORD_WEBHOOK_NA-Doc in src/index.ts.

# Täglicher Cron Trigger (Phase 1.5, siehe cleanupOrphanedDiscordCards/scheduled-Handler in
# src/index.ts) - räumt Discord-Karten von Gruppen auf, deren KV-Eintrag still per expirationTtl
# abgelaufen ist (siehe PROFILE_TTL_SECONDS-Doc dort), ohne dass vorher DELETE /group/:groupId
# aufgerufen wurde. Einmal täglich reicht völlig: das eigentliche stille TTL-Ablaufen selbst kann
# frühestens nach TTL_HOURS_MIN=1 Stunde passieren, eine für bis zu ~24h sichtbar bleibende
# verwaiste Karte ist ein akzeptabler Kompromiss gegenüber einem unnötig häufig laufenden Cron
# (der pro Lauf für JEDE Region den kompletten discordcards:<region>-Index durchgeht, siehe dort).
# UTC 03:00 gewählt, weil das für die drei größten Spielerregionen (NA/EU/JP) jeweils außerhalb der
# Haupt-Spielzeit liegt - reine Höflichkeit gegenüber der Discord-Rate-Limit-Situation, keine
# harte Notwendigkeit.
[triggers]
crons = ["0 3 * * *"]
